<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Tracing Dashboard</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f8fa; --panel2: #eaeef2; --border: #d0d7de;
    --text: #1f2328; --muted: #59636e; --accent: #0969da; --green: #1a7f37;
    --red: #cf222e; --yellow: #9a6700; --violet: #8250df;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: rgba(26, 127, 55, .08); color: var(--green);
    border: 1px solid rgba(26, 127, 55, .25);
  }
  .badge.off { background: rgba(89, 99, 110, .08); color: var(--muted); border-color: var(--border); }
  button, select, input[type="checkbox"] { cursor: pointer; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 16px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
  }
  .card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .card .value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .card.warn .value { color: var(--red); }
  .card.ok .value { color: var(--green); }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 16px; overflow: hidden;
  }
  .panel h2 {
    margin: 0; padding: 10px 14px; font-size: 13px; font-weight: 600;
    border-bottom: 1px solid var(--border); background: var(--panel2);
  }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 14px; align-items: center; }
  .filters label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .filters select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 13px; max-width: 220px;
  }
  .filters .row { display: flex; align-items: center; gap: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 14px; border-bottom: 1px solid var(--border); }
  th {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); font-weight: 600; background: var(--panel);
    position: sticky; top: 53px;
  }
  tbody tr:hover { background: var(--panel2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .pill {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px;
    border-radius: 999px; border: 1px solid var(--border);
  }
  .pill.ok { color: var(--green); border-color: rgba(26,127,55,.3); }
  .pill.err { color: var(--red); border-color: rgba(207,34,46,.3); }
  .pill.warn { color: var(--yellow); border-color: rgba(154,103,0,.3); }
  .pill.mut { color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--panel2); min-width: 60px; }
  .bar > i {
    display: block; height: 100%; border-radius: 3px; background: var(--violet);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  .empty code { color: var(--accent); }
  .err-banner {
    display: none; margin: 0 0 16px; padding: 10px 14px; border-radius: 8px;
    background: rgba(207, 34, 46, .08); border: 1px solid rgba(207, 34, 46, .3);
    color: var(--red); font-size: 13px;
  }
  footer { padding: 16px 20px 24px; text-align: center; color: var(--muted); font-size: 12px; }
  .endpoint-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<header>
  <h1>Token Tracing <span>Dashboard</span></h1>
  <span class="badge" id="live-badge">live · 5s</span>
  <div class="spacer"></div>
  <label class="row"><input type="checkbox" id="auto" checked> auto-refresh</label>
  <button id="refresh">Refresh</button>
</header>

<main>
  <div class="err-banner" id="err-banner"></div>

  <section class="cards">
    <div class="card"><div class="label">Calls</div><div class="value" id="c-calls">—</div><div class="sub" id="c-calls-sub"></div></div>
    <div class="card"><div class="label">Est. cost</div><div class="value" id="c-cost">—</div><div class="sub">USD, est.</div></div>
    <div class="card"><div class="label">Tokens</div><div class="value" id="c-tokens">—</div><div class="sub" id="c-tokens-sub"></div></div>
    <div class="card"><div class="label">Cache hit rate</div><div class="value" id="c-cache">—</div><div class="sub">prompt-prefix</div></div>
    <div class="card"><div class="label">Avg latency</div><div class="value" id="c-lat">—</div><div class="sub" id="c-lat-sub"></div></div>
    <div class="card" id="err-card"><div class="label">Errors</div><div class="value" id="c-err">—</div><div class="sub" id="c-err-sub"></div></div>
  </section>

  <section class="panel">
    <h2>Filters</h2>
    <div class="filters">
      <label>Model
        <select id="f-model"><option value="">all</option></select>
      </label>
      <label>Endpoint
        <select id="f-endpoint"><option value="">all</option></select>
      </label>
      <label>Provider
        <select id="f-provider"><option value="">all</option></select>
      </label>
      <label><input type="checkbox" id="f-error"> errors only</label>
      <label>Show
        <select id="f-limit">
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="250">250</option>
        </select>
      </label>
    </div>
  </section>

  <div class="grid2">
    <section class="panel">
      <h2>By model</h2>
      <div id="by-model"></div>
    </section>
    <section class="panel">
      <h2>By endpoint</h2>
      <div id="by-endpoint"></div>
    </section>
  </div>

  <section class="panel">
    <h2>Recent calls</h2>
    <div id="records"></div>
  </section>
</main>

<footer>
  Data from <span class="mono">/api/records</span> and <span class="mono">/api/summary</span> —
  served by <span class="mono">token_tracing.dashboard</span> (stdlib only).
</footer>

<script>
"use strict";

// Point this at the dashboard server when this page is embedded in another
// app (e.g. dropped into Vite's public/ or Angular's assets/). Set the API
// base before this script runs:
//   window.TOKEN_TRACING_API = "http://localhost:8765";
const API_BASE = window.TOKEN_TRACING_API || "";

const state = { model: "", endpoint: "", provider: "", errorOnly: false, limit: 100 };
let autoTimer = null;

const $ = (sel) => document.querySelector(sel);
const fmtNum = (n) => (n == null ? "—" : Number(n).toLocaleString());
const fmtMoney = (n) => (n == null || isNaN(n) ? "—" : "$" + Number(n).toFixed(4));
const fmtCompact = (n) => {
  if (n == null) return "—";
  if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
};
const fmtPct = (n) => (n == null ? "—" : (n * 100).toFixed(1) + "%");
const fmtDur = (ms) =>
  ms == null ? "—" : ms >= 1000 ? (ms / 1000).toFixed(2) + "s" : Math.round(ms) + "ms";

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

async function getJSON(url) {
  const resp = await fetch(API_BASE + url);
  if (!resp.ok) throw new Error(resp.status + " " + resp.statusText);
  return resp.json();
}

function params() {
  const p = new URLSearchParams();
  if (state.model) p.set("model", state.model);
  if (state.endpoint) p.set("endpoint", state.endpoint);
  if (state.provider) p.set("provider", state.provider);
  if (state.errorOnly) p.set("error", "1");
  p.set("limit", state.limit);
  return p.toString();
}

function fillSelect(sel, items, key, current) {
  const value = current || "";
  sel.innerHTML = '<option value="">all</option>' + items
    .map((it) => `<option value="${esc(it[key])}">${esc(it[key])}</option>`)
    .join("");
  sel.value = value;
}

function setBadge(on) {
  const b = $("#live-badge");
  b.textContent = on ? "live · 5s" : "paused";
  b.classList.toggle("off", !on);
}

function showError(msg) {
  const b = $("#err-banner");
  b.textContent = msg;
  b.style.display = "block";
}

function clearError() {
  $("#err-banner").style.display = "none";
}

// ── Summary cards ─────────────────────────────────────────────────────────────
function renderSummary(s) {
  $("#c-calls").textContent = fmtNum(s.total_calls);
  $("#c-calls-sub").textContent = s.last_record_at
    ? "last: " + new Date(s.last_record_at).toLocaleTimeString()
    : "no data yet";
  $("#c-cost").textContent = fmtMoney(s.total_cost_usd);
  $("#c-tokens").textContent = fmtCompact(s.total_tokens);
  $("#c-tokens-sub").textContent =
    fmtCompact(s.total_input_tokens) + " in / " + fmtCompact(s.total_output_tokens) + " out"
    + (s.total_cached_tokens ? " / " + fmtCompact(s.total_cached_tokens) + " cached" : "");
  $("#c-cache").textContent = fmtPct(s.cache_hit_rate);
  $("#c-lat").textContent = fmtDur(s.avg_duration_ms);
  $("#c-lat-sub").textContent = "p95 " + fmtDur(s.p95_duration_ms);
  $("#c-err").textContent = fmtNum(s.error_calls);
  $("#c-err-sub").textContent = fmtPct(s.error_rate);
  const errCard = $("#err-card");
  errCard.classList.toggle("warn", s.error_calls > 0);
}

function renderBreakdown(el, rows, maxCost) {
  if (!rows.length) {
    el.innerHTML = '<div class="empty">No matching records.</div>';
    return;
  }
  el.innerHTML =
    "<table><thead><tr>" +
    "<th>Name</th><th class='num'>Calls</th><th class='num'>Tokens</th>" +
    "<th class='num'>Errors</th><th class='num'>Cost</th><th>Share</th>" +
    "</tr></thead><tbody>" +
    rows.map((r) => {
      const width = maxCost > 0 ? Math.max(2, (r.cost_usd / maxCost) * 100) : 0;
      return "<tr>" +
        `<td class='mono'>${esc(r.name)}</td>` +
        `<td class='num'>${fmtNum(r.calls)}</td>` +
        `<td class='num'>${fmtCompact(r.total_tokens)}</td>` +
        `<td class='num'>${r.errors ? '<span class="pill err">' + r.errors + "</span>" : "—"}</td>` +
        `<td class='num'>${fmtMoney(r.cost_usd)}</td>` +
        `<td><div class='bar'><i style='width:${width}%'></i></div></td>` +
        "</tr>";
    }).join("") +
    "</tbody></table>";
}

// ── Records table ─────────────────────────────────────────────────────────────
function statusPills(r) {
  const pills = [];
  if (r.error) pills.push(`<span class="pill err" title="${esc(r.error)}">error</span>`);
  if (r.truncated) pills.push('<span class="pill warn">truncated</span>');
  if (r.is_retry) pills.push('<span class="pill mut">retry</span>');
  if (r.cache_hit) pills.push('<span class="pill mut">cache</span>');
  if (r.prompt_cache_hit) pills.push('<span class="pill ok">prompt-cache</span>');
  if (!pills.length) pills.push('<span class="pill ok">ok</span>');
  return pills.join(" ");
}

function renderRecords(list) {
  if (!list.length) {
    $("#records").innerHTML =
      '<div class="empty">No records yet. Point the server at a JSONL log ' +
      "(e.g. <code>--jsonl logs/llm_usage.jsonl</code>) and run some LLM calls.</div>";
    return;
  }
  $("#records").innerHTML =
    "<table><thead><tr>" +
    "<th>Time</th><th>Model</th><th>Endpoint</th><th>Provider</th>" +
    "<th class='num'>In / Out / Cached</th><th class='num'>Cost</th>" +
    "<th class='num'>Latency</th><th>Status</th>" +
    "</tr></thead><tbody>" +
    list.map((r) => {
      const ts = r.timestamp ? new Date(r.timestamp) : null;
      const when = ts && !isNaN(ts) ? ts.toLocaleTimeString() : "—";
      const title = ts && !isNaN(ts) ? ts.toLocaleString() : esc(r.timestamp || "");
      return "<tr>" +
        `<td class='mono' title='${title}'>${when}</td>` +
        `<td class='mono'>${esc(r.model || "—")}</td>` +
        `<td class='mono endpoint-cell' title='${esc(r.endpoint || "")}'>${esc(r.endpoint || "—")}</td>` +
        `<td class='mono'>${esc(r.provider || "—")}</td>` +
        `<td class='num mono' title='${fmtNum(r.input_tokens)} in / ${fmtNum(r.output_tokens)} out / ${fmtNum(r.cached_tokens)} cached'>` +
        `${fmtCompact(r.input_tokens)} / ${fmtCompact(r.output_tokens)} / ${fmtCompact(r.cached_tokens)}</td>` +
        `<td class='num'>${fmtMoney(r.estimated_cost_usd)}</td>` +
        `<td class='num'>${fmtDur(r.duration_ms)}</td>` +
        `<td>${statusPills(r)}</td>` +
        "</tr>";
    }).join("") +
    "</tbody></table>";
}

// ── Loaders ───────────────────────────────────────────────────────────────────
async function loadSummary() {
  const s = await getJSON("/api/summary?" + params());
  renderSummary(s);
  fillSelect($("#f-model"), s.per_model, "name", state.model);
  fillSelect($("#f-endpoint"), s.per_endpoint, "name", state.endpoint);
  fillSelect($("#f-provider"), s.per_provider, "name", state.provider);
  const maxCost = Math.max(0.000001, ...s.per_model.map((r) => r.cost_usd));
  renderBreakdown($("#by-model"), s.per_model, maxCost);
  const maxEp = Math.max(0.000001, ...s.per_endpoint.map((r) => r.cost_usd));
  renderBreakdown($("#by-endpoint"), s.per_endpoint, maxEp);
}

async function loadRecords() {
  const d = await getJSON("/api/records?" + params());
  renderRecords(d.records);
}

async function refresh() {
  try {
    await Promise.all([loadSummary(), loadRecords()]);
    clearError();
  } catch (e) {
    showError("Could not reach the dashboard API (" + e.message +
      "). Start it with: python -m token_tracing.dashboard --jsonl llm_usage.jsonl");
  }
}

// ── Wiring ────────────────────────────────────────────────────────────────────
$("#refresh").addEventListener("click", refresh);
$("#f-model").addEventListener("change", (e) => { state.model = e.target.value; refresh(); });
$("#f-endpoint").addEventListener("change", (e) => { state.endpoint = e.target.value; refresh(); });
$("#f-provider").addEventListener("change", (e) => { state.provider = e.target.value; refresh(); });
$("#f-error").addEventListener("change", (e) => { state.errorOnly = e.target.checked; refresh(); });
$("#f-limit").addEventListener("change", (e) => { state.limit = Number(e.target.value); refresh(); });
$("#auto").addEventListener("change", (e) => {
  if (e.target.checked) {
    autoTimer = setInterval(refresh, 5000);
    setBadge(true);
  } else {
    clearInterval(autoTimer);
    autoTimer = null;
    setBadge(false);
  }
});

autoTimer = setInterval(refresh, 5000);
setBadge(true);
refresh();
</script>
</body>
</html>

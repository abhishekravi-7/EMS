name: Production CI/CD

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:


permissions:
  contents: read
  packages: write
  pull-requests: read


concurrency:
  group: production-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/javaapex


jobs:

  # ============================================================
  # FRONTEND
  # ============================================================
  frontend:
    name: Frontend production gates
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./APEX-Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: APEX-Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: npm dependency audit
        run: |
          set -o pipefail
          npm audit \
            --audit-level=moderate \
            --json \
            2>&1 | tee npm-audit-report.json

      - name: ESLint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee eslint.log

      - name: TypeScript check
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Frontend unit tests
        run: |
          if find . -type f \( -name "*.test.*" -o -name "*.spec.*" \) | grep -q .; then
            set -o pipefail
            npm test -- --run 2>&1 | tee unit-tests.log
          else
            echo "No frontend unit tests detected; skipping." | tee unit-tests.log
          fi

      - name: Vite production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee vite-build.log

      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-reports
          path: |
            APEX-Frontend/npm-audit-report.json
            APEX-Frontend/eslint.log
            APEX-Frontend/typecheck.log
            APEX-Frontend/unit-tests.log
            APEX-Frontend/vite-build.log
          if-no-files-found: ignore


  # ============================================================
  # BACKEND
  # ============================================================
  backend:
    name: Backend production gates
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./APEX-Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: APEX-Backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio respx ruff bandit pip-audit

      - name: pip dependency audit
        run: |
          pip-audit \
            -r requirements.txt \
            -f json \
            -o pip-audit-report.json

      - name: Ruff lint
        run: |
          set -o pipefail
          ruff check . 2>&1 | tee ruff.log

      - name: Pytest
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log

      - name: Bandit security scan
        run: |
          set -o pipefail
          bandit \
            -r app \
            -f txt \
            -o bandit.log

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-reports
          path: |
            APEX-Backend/pip-audit-report.json
            APEX-Backend/ruff.log
            APEX-Backend/pytest.log
            APEX-Backend/bandit.log
          if-no-files-found: ignore


  # ============================================================
  # SECURITY
  # ============================================================
  security:
    name: Production security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            detect
            --source .
            --no-banner
            --redact
            --report-format json
            --report-path .gitleaks-report.json
            --exit-code 1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-results.txt
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          version: v0.70.0
          cache: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-production-reports
          path: |
            .gitleaks-report.json
            trivy-results.txt
          if-no-files-found: ignore


  # ============================================================
  # SONARCLOUD
  # ============================================================
  sonar:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - security

    if: ${{ always() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300


  # ============================================================
  # SEMGREP SAST
  # ============================================================
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Check Semgrep version
        run: |
          semgrep --version

      # --------------------------------------------------------
      # Main JSON scan
      # Observation mode
      # --------------------------------------------------------
      - name: Run Semgrep SAST
        id: semgrep_scan
        run: |
          semgrep scan \
            --config auto \
            APEX-Backend/app \
            APEX-Frontend/src \
            --json \
            --output semgrep-report.json

      # --------------------------------------------------------
      # Create readable text report
      # --------------------------------------------------------
      - name: Generate readable Semgrep report
        if: always()
        shell: bash
        run: |
          python <<'PYTHON'
          import json
          from pathlib import Path
          from collections import Counter

          report_path = Path("semgrep-report.json")
          output_path = Path("semgrep-report.txt")

          if not report_path.exists():
              output_path.write_text(
                  "Semgrep report was not generated.\n",
                  encoding="utf-8"
              )
              raise SystemExit(0)

          data = json.loads(
              report_path.read_text(encoding="utf-8")
          )

          results = data.get("results", [])
          parser_errors = data.get("errors", [])

          severities = Counter(
              result.get("extra", {}).get(
                  "severity",
                  "UNKNOWN"
              ).upper()
              for result in results
          )

          lines = []

          lines.append("=" * 80)
          lines.append("                    SEMGREP SAST SECURITY REPORT")
          lines.append("=" * 80)
          lines.append("")

          lines.append("SUMMARY")
          lines.append("-" * 80)

          lines.append(f"Total Findings : {len(results)}")
          lines.append(f"ERROR          : {severities.get('ERROR', 0)}")
          lines.append(f"WARNING        : {severities.get('WARNING', 0)}")
          lines.append(f"INFO           : {severities.get('INFO', 0)}")
          lines.append(f"Parser Warnings: {len(parser_errors)}")
          lines.append("")

          if not results:
              lines.append("No Semgrep security findings detected.")
          else:
              lines.append("DETAILED FINDINGS")
              lines.append("-" * 80)

              for index, result in enumerate(results, start=1):
                  extra = result.get("extra", {})
                  metadata = extra.get("metadata", {})

                  severity = extra.get("severity", "UNKNOWN")
                  path = result.get("path", "Unknown")
                  line_number = result.get("start", {}).get("line", "Unknown")
                  rule_id = result.get("check_id", "Unknown")
                  message = extra.get("message", "No description")

                  vulnerability = metadata.get(
                      "vulnerability_class",
                      []
                  )

                  cwe = metadata.get("cwe", [])
                  owasp = metadata.get("owasp", [])

                  if isinstance(vulnerability, list):
                      vulnerability = ", ".join(map(str, vulnerability))

                  if isinstance(cwe, list):
                      cwe = ", ".join(map(str, cwe))

                  if isinstance(owasp, list):
                      owasp = ", ".join(map(str, owasp))

                  lines.append("")
                  lines.append(f"Finding #{index}")
                  lines.append("-" * 40)
                  lines.append(f"Severity      : {severity}")
                  lines.append(f"File          : {path}")
                  lines.append(f"Line          : {line_number}")
                  lines.append(f"Rule          : {rule_id}")

                  if vulnerability:
                      lines.append(f"Vulnerability : {vulnerability}")

                  if cwe:
                      lines.append(f"CWE           : {cwe}")

                  if owasp:
                      lines.append(f"OWASP         : {owasp}")

                  lines.append(f"Description   : {message}")

          if parser_errors:
              lines.append("")
              lines.append("=" * 80)
              lines.append("PARSING / ANALYSIS WARNINGS")
              lines.append("=" * 80)

              for index, error in enumerate(parser_errors, start=1):
                  lines.append("")
                  lines.append(f"Warning #{index}")
                  lines.append(
                      f"File    : {error.get('path', 'Unknown')}"
                  )
                  lines.append(
                      f"Message : {error.get('message', 'Unknown warning')}"
                  )

          lines.append("")
          lines.append("=" * 80)
          lines.append("END OF SEMGREP REPORT")
          lines.append("=" * 80)

          output_path.write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print("\n".join(lines))
          PYTHON


      # --------------------------------------------------------
      # Show readable report in GitHub Actions logs
      # --------------------------------------------------------
      - name: Display Semgrep readable report
        if: always()
        shell: bash
        run: |
          if [[ -f semgrep-report.txt ]]; then
            cat semgrep-report.txt
          else
            echo "Semgrep readable report was not generated."
          fi


      # --------------------------------------------------------
      # GitHub Job Summary
      # --------------------------------------------------------
      - name: Create Semgrep GitHub summary
        if: always()
        shell: bash
        run: |
          python <<'PYTHON'
          import json
          import os
          from pathlib import Path
          from collections import Counter

          report_file = Path("semgrep-report.json")
          summary_file = Path(os.environ["GITHUB_STEP_SUMMARY"])

          with summary_file.open("a", encoding="utf-8") as summary:
              summary.write("# Semgrep SAST Report\n\n")

              if not report_file.exists():
                  summary.write("Semgrep report was not generated.\n")
                  raise SystemExit(0)

              data = json.loads(
                  report_file.read_text(encoding="utf-8")
              )

              results = data.get("results", [])
              parser_errors = data.get("errors", [])

              severities = Counter(
                  item.get("extra", {})
                      .get("severity", "UNKNOWN")
                      .upper()
                  for item in results
              )

              summary.write("## Summary\n\n")

              summary.write("| Metric | Count |\n")
              summary.write("|---|---:|\n")
              summary.write(f"| Total findings | {len(results)} |\n")
              summary.write(f"| ERROR | {severities.get('ERROR', 0)} |\n")
              summary.write(f"| WARNING | {severities.get('WARNING', 0)} |\n")
              summary.write(f"| INFO | {severities.get('INFO', 0)} |\n")
              summary.write(f"| Parser warnings | {len(parser_errors)} |\n\n")

              if not results:
                  summary.write("No Semgrep security findings detected.\n")
                  raise SystemExit(0)

              summary.write("## Findings\n\n")

              summary.write(
                  "| Severity | File | Line | Vulnerability | Description |\n"
              )
              summary.write(
                  "|---|---|---:|---|---|\n"
              )

              for result in results:
                  extra = result.get("extra", {})
                  metadata = extra.get("metadata", {})

                  severity = extra.get("severity", "UNKNOWN")
                  path = result.get("path", "Unknown")
                  line = result.get("start", {}).get("line", "?")

                  vulnerability = metadata.get(
                      "vulnerability_class",
                      []
                  )

                  if isinstance(vulnerability, list):
                      vulnerability = ", ".join(
                          map(str, vulnerability)
                      )

                  message = extra.get("message", "")

                  message = (
                      message
                      .replace("|", "\\|")
                      .replace("\n", " ")
                  )

                  vulnerability = (
                      str(vulnerability)
                      .replace("|", "\\|")
                  )

                  summary.write(
                      f"| {severity} "
                      f"| `{path}` "
                      f"| {line} "
                      f"| {vulnerability} "
                      f"| {message} |\n"
                  )

          PYTHON


      # --------------------------------------------------------
      # Upload JSON + readable TXT report
      # --------------------------------------------------------
      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-reports
          path: |
            semgrep-report.json
            semgrep-report.txt
          if-no-files-found: ignore


  # ============================================================
  # PRODUCTION VALIDATION
  # ============================================================
  production-validation:
    name: Production validation
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - security
      - sonar
      - semgrep

    if: ${{ always() }}

    steps:
      - name: Display production gate results
        shell: bash
        run: |
          echo "=========================================="
          echo "       PRODUCTION CI RESULTS"
          echo "=========================================="

          echo "Frontend : ${{ needs.frontend.result }}"
          echo "Backend  : ${{ needs.backend.result }}"
          echo "Security : ${{ needs.security.result }}"
          echo "Sonar    : ${{ needs.sonar.result }}"
          echo "Semgrep  : ${{ needs.semgrep.result }}"

      - name: Validate required production gates
        shell: bash
        run: |
          failed=0

          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "Frontend production gates FAILED"
            failed=1
          fi

          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "Backend production gates FAILED"
            failed=1
          fi

          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "Production security scans FAILED"
            failed=1
          fi

          if [[ "${{ needs.sonar.result }}" != "success" ]]; then
            echo "SonarCloud Quality Gate FAILED"
            failed=1
          fi

          if [[ "${{ needs.semgrep.result }}" != "success" ]]; then
            echo "Semgrep SAST FAILED"
            failed=1
          fi

          if [[ "$failed" -eq 1 ]]; then
            echo ""
            echo "PRODUCTION VALIDATION FAILED"
            echo "Docker image will NOT be created."
            echo "DigitalOcean deployment will NOT run."

            exit 1
          fi

          echo ""
          echo "PRODUCTION VALIDATION PASSED"


  # ============================================================
  # DOCKER + GHCR
  # ============================================================
  docker-image:
    name: Build and push production image
    runs-on: ubuntu-latest

    needs:
      - production-validation

    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.production-validation.result == 'success'
      }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # DIGITALOCEAN
  # ============================================================
  deploy:
    name: Deploy to DigitalOcean App Platform
    runs-on: ubuntu-latest

    needs:
      - docker-image

    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.docker-image.result == 'success'
      }}

    environment:
      name: production

    steps:
      - name: Set up DigitalOcean CLI
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Deploy existing DigitalOcean App Platform app
        shell: bash
        run: |
          echo "Triggering DigitalOcean deployment..."

          doctl apps create-deployment \
            "${{ secrets.DO_APP_ID }}" \
            --wait

          echo "DigitalOcean deployment completed successfully."


  # ============================================================
  # MICROSOFT TEAMS NOTIFICATION
  #
  # Same Teams channel as Integration CI
  # using TEAMS_WEBHOOK_URL
  # ============================================================
  notify:
    name: Teams notification
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - security
      - sonar
      - semgrep
      - production-validation
      - docker-image
      - deploy

    if: ${{ always() }}

    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

    steps:

      # ========================================================
      # SUCCESS
      # ========================================================
      - name: Send Teams success notification
        if: >-
          ${{
            env.TEAMS_WEBHOOK_URL != '' &&
            needs.frontend.result == 'success' &&
            needs.backend.result == 'success' &&
            needs.security.result == 'success' &&
            needs.sonar.result == 'success' &&
            needs.semgrep.result == 'success' &&
            needs.production-validation.result == 'success' &&
            (
              github.event_name == 'pull_request' ||
              (
                needs.docker-image.result == 'success' &&
                needs.deploy.result == 'success'
              )
            )
          }}

        shell: bash
        run: |
          payload=$(cat <<JSON
          {
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.5",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "JavaAPEX Production CI/CD Passed",
                      "weight": "Bolder",
                      "size": "Medium",
                      "color": "Good"
                    },
                    {
                      "type": "FactSet",
                      "facts": [
                        {
                          "title": "Repository",
                          "value": "${{ github.repository }}"
                        },
                        {
                          "title": "Branch",
                          "value": "${{ github.ref_name }}"
                        },
                        {
                          "title": "Commit",
                          "value": "${{ github.sha }}"
                        },
                        {
                          "title": "Workflow",
                          "value": "${{ github.workflow }}"
                        },
                        {
                          "title": "Frontend",
                          "value": "${{ needs.frontend.result }}"
                        },
                        {
                          "title": "Backend",
                          "value": "${{ needs.backend.result }}"
                        },
                        {
                          "title": "Security",
                          "value": "${{ needs.security.result }}"
                        },
                        {
                          "title": "SonarCloud",
                          "value": "${{ needs.sonar.result }}"
                        },
                        {
                          "title": "Semgrep",
                          "value": "${{ needs.semgrep.result }}"
                        },
                        {
                          "title": "Production Validation",
                          "value": "${{ needs.production-validation.result }}"
                        },
                        {
                          "title": "Docker / GHCR",
                          "value": "${{ needs.docker-image.result }}"
                        },
                        {
                          "title": "DigitalOcean",
                          "value": "${{ needs.deploy.result }}"
                        },
                        {
                          "title": "Run URL",
                          "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    },
                    {
                      "type": "TextBlock",
                      "text": "Production CI/CD completed successfully.",
                      "wrap": true
                    }
                  ]
                }
              }
            ]
          }
          JSON
          )

          response_file="$(mktemp)"

          http_code="$(
            curl -sS \
              -H "Content-Type: application/json" \
              -d "$payload" \
              -o "$response_file" \
              -w '%{http_code}' \
              "$TEAMS_WEBHOOK_URL"
          )"

          if [[ "$http_code" != 2* ]]; then
            echo "Teams webhook failed with HTTP status: $http_code"
            cat "$response_file"
            exit 1
          fi


      # ========================================================
      # FAILURE
      # ========================================================
      - name: Send Teams failure notification
        if: >-
          ${{
            env.TEAMS_WEBHOOK_URL != '' &&
            (
              needs.frontend.result == 'failure' ||
              needs.backend.result == 'failure' ||
              needs.security.result == 'failure' ||
              needs.sonar.result == 'failure' ||
              needs.semgrep.result == 'failure' ||
              needs.production-validation.result == 'failure' ||
              needs.docker-image.result == 'failure' ||
              needs.deploy.result == 'failure'
            )
          }}

        shell: bash
        run: |
          failed_jobs=()

          if [[ "${{ needs.frontend.result }}" == "failure" ]]; then
            failed_jobs+=("Frontend production gates")
          fi

          if [[ "${{ needs.backend.result }}" == "failure" ]]; then
            failed_jobs+=("Backend production gates")
          fi

          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            failed_jobs+=("Production security scans")
          fi

          if [[ "${{ needs.sonar.result }}" == "failure" ]]; then
            failed_jobs+=("SonarCloud Quality Gate")
          fi

          if [[ "${{ needs.semgrep.result }}" == "failure" ]]; then
            failed_jobs+=("Semgrep SAST")
          fi

          if [[ "${{ needs.production-validation.result }}" == "failure" ]]; then
            failed_jobs+=("Production validation")
          fi

          if [[ "${{ needs.docker-image.result }}" == "failure" ]]; then
            failed_jobs+=("Docker / GHCR")
          fi

          if [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            failed_jobs+=("DigitalOcean deployment")
          fi

          failed_jobs_text="$(IFS=', '; echo "${failed_jobs[*]}")"

          payload=$(cat <<JSON
          {
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.5",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "JavaAPEX Production CI/CD Failed",
                      "weight": "Bolder",
                      "size": "Medium",
                      "color": "Attention"
                    },
                    {
                      "type": "FactSet",
                      "facts": [
                        {
                          "title": "Repository",
                          "value": "${{ github.repository }}"
                        },
                        {
                          "title": "Branch",
                          "value": "${{ github.ref_name }}"
                        },
                        {
                          "title": "Commit",
                          "value": "${{ github.sha }}"
                        },
                        {
                          "title": "Workflow",
                          "value": "${{ github.workflow }}"
                        },
                        {
                          "title": "Failed Jobs",
                          "value": "$failed_jobs_text"
                        },
                        {
                          "title": "Frontend",
                          "value": "${{ needs.frontend.result }}"
                        },
                        {
                          "title": "Backend",
                          "value": "${{ needs.backend.result }}"
                        },
                        {
                          "title": "Security",
                          "value": "${{ needs.security.result }}"
                        },
                        {
                          "title": "SonarCloud",
                          "value": "${{ needs.sonar.result }}"
                        },
                        {
                          "title": "Semgrep",
                          "value": "${{ needs.semgrep.result }}"
                        },
                        {
                          "title": "Production Validation",
                          "value": "${{ needs.production-validation.result }}"
                        },
                        {
                          "title": "Docker / GHCR",
                          "value": "${{ needs.docker-image.result }}"
                        },
                        {
                          "title": "DigitalOcean",
                          "value": "${{ needs.deploy.result }}"
                        },
                        {
                          "title": "Run URL",
                          "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    },
                    {
                      "type": "TextBlock",
                      "text": "Review the failed jobs and security reports in GitHub Actions.",
                      "wrap": true
                    }
                  ]
                }
              }
            ]
          }
          JSON
          )

          response_file="$(mktemp)"

          http_code="$(
            curl -sS \
              -H "Content-Type: application/json" \
              -d "$payload" \
              -o "$response_file" \
              -w '%{http_code}' \
              "$TEAMS_WEBHOOK_URL"
          )"

          if [[ "$http_code" != 2* ]]; then
            echo "Teams webhook failed with HTTP status: $http_code"
            cat "$response_file"
            exit 1
          fi
